contract.art10.title=DECLARACIONES Y COMPROMISOS DEL INVERSOR
contract.art10.intro=Al firmar el presente contrato, el Inversor declara y garantiza:
contract.art10.item1=✔ Haber leído y comprendido íntegramente las condiciones de este contrato;
contract.art10.item2=✔ Ser mayor de edad (18 años cumplidos) y tener plena capacidad jurídica;
contract.art10.item3=✔ Que los fondos invertidos provienen de una fuente lícita y transparente;
contract.art10.item4=✔ Aceptar el riesgo de pérdida parcial o total del capital invertido;
contract.art10.item5=✔ No actuar por cuenta de una entidad sujeta a sanciones internacionales;
contract.art10.item6=✔ Comprometerse a informar a GrowzApp de cualquier cambio de situación (datos de contacto, estatus fiscal).

