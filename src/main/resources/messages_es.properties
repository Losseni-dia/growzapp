contract.section.general_conditions=📋 CONDICIONES GENERALES DE INVERSIÓN

contract.art1.title=OBJETO Y NATURALEZA DEL CONTRATO
contract.art1.p1=El presente contrato tiene por objeto la participación del Inversor en el capital del Proyecto designado anteriormente, a través de la plataforma GrowzApp, operador de financiación colectiva en capital (<em>equity crowdfunding</em>).
contract.art1.p2=Esta participación otorga al Inversor la condición de socio minoritario, con los derechos y obligaciones correspondientes definidos por el <strong>Acta Uniforme OHADA sobre Sociedades Comerciales y Agrupaciones de Interés Económico (AUSCGIE)</strong>, en particular en sus artículos 7, 45, 50 y 853 y siguientes.
contract.art1.ref=📖 Referencia legal: AUSCGIE, Art. 50 — Acta Uniforme revisada el 30 de enero de 2014, OHADA

contract.art2.title=PROPIEDAD DE LAS ACCIONES Y TRANSFERENCIA DE PROPIEDAD
contract.art2.p1=El Inversor se convierte en propietario de las acciones sociales mencionadas anteriormente desde la confirmación del pago y la validación de la inversión por GrowzApp. Esta propiedad es oponible frente a terceros desde su inscripción en el registro de socios llevado por GrowzApp conforme al AUSCGIE Art. 317.
contract.art2.p2=<strong>2.1 Derechos vinculados a las acciones:</strong> Las acciones otorgan a su titular un derecho proporcional a los beneficios distribuidos, un derecho de voto consultivo en las asambleas anuales del proyecto, y un derecho a la información periódica sobre el avance del proyecto.
contract.art2.p3=<strong>2.2 Indivisibilidad:</strong> Las acciones son indivisibles respecto de GrowzApp y del promotor del proyecto. En caso de pluralidad de propietarios de una misma acción, éstos deberán hacerse representar por un mandatario único (AUSCGIE Art. 321).
contract.art2.ref=📖 Referencia legal: AUSCGIE, Art. 317, 321, 853 — OHADA 2014

contract.art3.title=DEPÓSITO EN GARANTÍA Y BLOQUEO DE FONDOS
contract.art3.p1=Los fondos invertidos se aseguran inmediatamente en una cuenta de depósito en garantía dedicada, distinta de los fondos propios de GrowzApp, conforme a las exigencias del <strong>BCEAO</strong> en materia de protección de los fondos de los usuarios de moneda electrónica (Instrucción BCEAO N.º 008-05-2015 y siguientes).
contract.art3.p2=Los fondos se liberan al promotor del proyecto según un calendario de hitos validados por el equipo de expertos de GrowzApp. En caso de no alcanzarse los objetivos de recaudación en el plazo previsto, los fondos se restituyen íntegramente al Inversor sin costo alguno.
contract.art3.p3=<strong>3.1 Garantía de restitución:</strong> GrowzApp se compromete a restituir los fondos del Inversor en un plazo de 5 días hábiles si no se alcanza el objetivo de financiación en la fecha límite fijada.
contract.art3.ref=📖 Referencia legal: Instrucción BCEAO N.º 008-05-2015 sobre moneda electrónica — Reglamento UEMOA N.º 15/2002/CM/UEMOA

contract.art4.title=DISTRIBUCIÓN DE DIVIDENDOS Y BENEFICIOS
contract.art4.p1=Los dividendos se calculan a prorrata de las acciones que posee el Inversor y se distribuyen anualmente, tras el cierre y validación del ejercicio contable del proyecto por un auditor independiente autorizado.
contract.art4.p2=<strong>4.1 Modalidades de distribución:</strong> Los dividendos se abonan en el Wallet GrowzApp del Inversor, y luego pueden retirarse mediante los medios de pago disponibles en la plataforma (Orange Money, MTN Mobile Money, Wave, transferencia bancaria).
contract.art4.p3=<strong>4.2 Fiscalidad:</strong> Los dividendos percibidos están sujetos a los impuestos vigentes en Costa de Marfil y en el espacio UEMOA. El Inversor es responsable de declarar sus ingresos conforme a la legislación fiscal de su país de residencia. GrowzApp puede emitir un certificado fiscal a solicitud.
contract.art4.p4=<strong>4.3 Retención en la fuente:</strong> Conforme al Código General de Impuestos de Costa de Marfil, puede aplicarse una retención sobre dividendos del 15% para los inversores residentes, y del 18% para los no residentes, salvo convenio fiscal bilateral aplicable.
contract.art4.ref=📖 Referencia legal: AUSCGIE Art. 144 (distribución de beneficios) — Código General de Impuestos CI, Art. 95 — Directiva UEMOA N.º 001/2008

contract.art5.title=LIQUIDEZ, CESIÓN Y TRANSFERENCIA DE ACCIONES
contract.art5.p1=La reventa o transferencia de las acciones está sujeta a las siguientes condiciones, de conformidad con los estatutos del proyecto y la normativa OHADA vigente:
contract.art5.p2=<strong>5.1 Derecho de preferencia:</strong> En caso de cesión, los demás socios (coinversores) disponen de un derecho de preferencia prioritario para adquirir las acciones al precio propuesto, durante 30 días naturales a partir de la notificación de la cesión (AUSCGIE Art. 323).
contract.art5.p3=<strong>5.2 Tag-Along (derecho de acompañamiento):</strong> Todo socio mayoritario que ceda sus acciones debe ofrecer a los socios minoritarios (incluido el Inversor) la posibilidad de ceder sus acciones en las mismas condiciones (precio, comprador, plazos).
contract.art5.p4=<strong>5.3 Drag-Along (derecho de arrastre):</strong> Si los socios que representan más del 75% del capital deciden ceder la totalidad del proyecto, los socios minoritarios pueden verse obligados a ceder sus acciones en las mismas condiciones.
contract.art5.p5=<strong>5.4 Período mínimo de bloqueo:</strong> Las acciones no pueden cederse antes de que expire un período mínimo de 12 meses a partir de la fecha de validación de la inversión.
contract.art5.ref=📖 Referencia legal: AUSCGIE Art. 323, 329 — AUSCGIE Art. 56 (autorización de cesión)

contract.art6.title=OBLIGACIONES Y RESPONSABILIDADES DE GROWZAPP
contract.art6.p1=<strong>6.1</strong> GrowzApp se compromete a realizar una diligencia debida rigurosa sobre cada proyecto presentado en la plataforma, incluyendo la verificación de la identidad del promotor, la viabilidad económica del proyecto y el cumplimiento normativo.
contract.art6.p2=<strong>6.2</strong> GrowzApp pone a disposición del Inversor informes trimestrales de avance del proyecto, así como acceso a un espacio personal seguro que permite seguir la evolución de su cartera.
contract.art6.p3=<strong>6.3</strong> GrowzApp no podrá ser considerada responsable de los riesgos económicos, climáticos, normativos o de fuerza mayor que afecten el rendimiento del proyecto, conforme al artículo 1148 del Código Civil de Costa de Marfil aplicado por analogía.
contract.art6.p4=<strong>6.4 Protección de datos:</strong> GrowzApp trata los datos personales del Inversor conforme a la Ley N.º 2013-450 del 19 de junio de 2013 relativa a la protección de datos personales en Costa de Marfil y a las recomendaciones de la ARTCI.

contract.art7.title=CUMPLIMIENTO NORMATIVO UEMOA / BCEAO
contract.art7.p1=El presente contrato se establece conforme al marco regulatorio de la Unión Económica y Monetaria del África Occidental (UEMOA), en particular:
contract.art7.p2=<strong>7.1 Liquidación de pagos:</strong> Todas las transacciones financieras vinculadas a este contrato se realizan a través de canales de pago autorizados por el BCEAO, conforme al Reglamento UEMOA N.º 15/2002/CM/UEMOA sobre sistemas de pago.
contract.art7.p3=<strong>7.2 ALD-FT:</strong> GrowzApp aplica un procedimiento estricto de Lucha Contra el Lavado de Dinero y la Financiación del Terrorismo (ALD-FT) conforme a la Directiva UEMOA N.º 02/2015/CM/UEMOA y a la Ley N.º 2016-992 del 22 de noviembre de 2016 en Costa de Marfil. El Inversor certifica que los fondos invertidos provienen de una fuente lícita.
contract.art7.p4=<strong>7.3 KYC (Conozca a su cliente):</strong> La verificación de identidad del Inversor se ha realizado conforme a los estándares KYC del BCEAO. Cualquier información errónea proporcionada por el Inversor conlleva la resolución inmediata del contrato y el bloqueo de los fondos en espera de instrucción judicial.
contract.art7.ref=📖 Referencia legal: Directiva UEMOA N.º 02/2015/CM/UEMOA — Instrucción BCEAO N.º 01-2006 — Ley CI N.º 2016-992

contract.art8.title=RESOLUCIÓN DE CONTROVERSIAS Y LEY APLICABLE
contract.art8.p1=<strong>8.1 Ley aplicable:</strong> El presente contrato se rige por las leyes de la República de Costa de Marfil y por el Acta Uniforme OHADA relativa al Derecho de Sociedades Comerciales, así como por cualquier texto comunitario UEMOA aplicable.
contract.art8.p2=<strong>8.2 Mediación:</strong> En caso de controversia, las partes se comprometen a buscar una solución amistosa en un plazo de 30 días a partir de la notificación del desacuerdo por cualquiera de las partes.
contract.art8.p3=<strong>8.3 Arbitraje CCJA:</strong> A falta de resolución amistosa, toda controversia se someterá al arbitraje de la <strong>Corte Común de Justicia y Arbitraje (CCJA)</strong> de la OHADA, con sede en Abiyán, conforme a su reglamento de arbitraje. El idioma del procedimiento será el francés.
contract.art8.p4=<strong>8.4 Jurisdicción subsidiaria:</strong> Si el arbitraje no fuera aplicable, los tribunales competentes de Abiyán, Costa de Marfil, tendrán competencia exclusiva.
contract.art8.ref=📖 Referencia legal: Tratado OHADA Art. 21 — Reglamento de Arbitraje CCJA revisado en 2017 — Código de Procedimiento Civil CI

