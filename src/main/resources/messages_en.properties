contract.section.general_conditions=📋 GENERAL INVESTMENT TERMS AND CONDITIONS

contract.art1.title=SUBJECT AND NATURE OF THE CONTRACT
contract.art1.p1=This contract concerns the Investor's equity participation in the capital of the Project designated above, via the GrowzApp platform, an equity crowdfunding operator.
contract.art1.p2=This participation grants the Investor minority shareholder status, with the rights and obligations attached thereto as defined by the <strong>OHADA Uniform Act on Commercial Companies and Economic Interest Groups (AUSCGIE)</strong>, notably in Articles 7, 45, 50 and 853 et seq.
contract.art1.ref=📖 Legal reference: AUSCGIE, Art. 50 — Uniform Act revised on 30 January 2014, OHADA

contract.art2.title=OWNERSHIP OF SHARES AND TRANSFER OF OWNERSHIP
contract.art2.p1=The Investor becomes the owner of the aforementioned shares upon confirmation of payment and validation of the investment by GrowzApp. This ownership is enforceable against third parties upon registration in the shareholders' register maintained by GrowzApp in accordance with AUSCGIE Art. 317.
contract.art2.p2=<strong>2.1 Rights attached to shares:</strong> Shares grant their holder a proportional right to distributed profits, a consultative voting right at the project's annual meetings, and a right to periodic information on project progress.
contract.art2.p3=<strong>2.2 Indivisibility:</strong> Shares are indivisible with respect to GrowzApp and the project owner. In the event of multiple owners of the same share, they must be represented by a single proxy (AUSCGIE Art. 321).
contract.art2.ref=📖 Legal reference: AUSCGIE, Art. 317, 321, 853 — OHADA 2014

contract.art3.title=ESCROW AND FUND HOLDING
contract.art3.p1=Invested funds are immediately secured in a dedicated escrow account, separate from GrowzApp's own funds, in accordance with <strong>BCEAO</strong> requirements for protecting electronic money users' funds (BCEAO Instruction No. 008-05-2015 and subsequent amendments).
contract.art3.p2=Funds are released to the project owner according to a milestone schedule validated by the GrowzApp expert team. Should the fundraising targets not be met within the allotted timeframe, the funds are fully returned to the Investor free of charge.
contract.art3.p3=<strong>3.1 Refund guarantee:</strong> GrowzApp undertakes to return the Investor's funds within 5 business days if the funding target is not reached by the set deadline.
contract.art3.ref=📖 Legal reference: BCEAO Instruction No. 008-05-2015 on electronic money — WAEMU Regulation No. 15/2002/CM/WAEMU

contract.art4.title=DISTRIBUTION OF DIVIDENDS AND PROFITS
contract.art4.p1=Dividends are calculated in proportion to the shares held by the Investor and distributed annually, after the project's financial year has been closed and validated by an accredited independent auditor.
contract.art4.p2=<strong>4.1 Distribution terms:</strong> Dividends are paid into the Investor's GrowzApp Wallet, then withdrawable via the payment methods available on the platform (Orange Money, MTN Mobile Money, Wave, bank transfer).
contract.art4.p3=<strong>4.2 Taxation:</strong> Dividends received are subject to taxes in force in Côte d'Ivoire and within WAEMU. The Investor is responsible for declaring their income in accordance with the tax legislation of their country of residence. GrowzApp may issue a tax certificate upon request.
contract.art4.p4=<strong>4.3 Withholding tax:</strong> In accordance with the Ivorian General Tax Code, a 15% dividend withholding may apply to resident investors, and 18% to non-residents, unless an applicable bilateral tax treaty provides otherwise.
contract.art4.ref=📖 Legal reference: AUSCGIE Art. 144 (profit distribution) — Ivorian General Tax Code, Art. 95 — WAEMU Directive No. 001/2008

contract.art5.title=LIQUIDITY, ASSIGNMENT AND TRANSFER OF SHARES
contract.art5.p1=The resale or transfer of shares is subject to the following conditions, in accordance with the project's bylaws and applicable OHADA regulations:
contract.art5.p2=<strong>5.1 Right of first refusal:</strong> In the event of a transfer, the other shareholders (co-investors) have a priority right to acquire the shares at the proposed price, for 30 calendar days from notification of the transfer (AUSCGIE Art. 323).
contract.art5.p3=<strong>5.2 Tag-Along right:</strong> Any majority shareholder transferring their shares must offer minority shareholders (including the Investor) the opportunity to sell their shares under the same conditions (price, buyer, timeframes).
contract.art5.p4=<strong>5.3 Drag-Along right:</strong> If shareholders representing more than 75% of the capital decide to sell the entire project, minority shareholders may be required to sell their shares under the same conditions.
contract.art5.p5=<strong>5.4 Minimum lock-up period:</strong> Shares may not be transferred before the expiry of a minimum period of 12 months from the date the investment is validated.
contract.art5.ref=📖 Legal reference: AUSCGIE Art. 323, 329 — AUSCGIE Art. 56 (approval of transfer)

contract.art6.title=OBLIGATIONS AND RESPONSIBILITIES OF GROWZAPP
contract.art6.p1=<strong>6.1</strong> GrowzApp undertakes to carry out rigorous due diligence on each project presented on the platform, including verification of the owner's identity, the project's economic viability, and regulatory compliance.
contract.art6.p2=<strong>6.2</strong> GrowzApp provides the Investor with quarterly project progress reports, as well as access to a secure personal space to track the evolution of their portfolio.
contract.art6.p3=<strong>6.3</strong> GrowzApp shall not be held liable for economic, climatic, regulatory hazards or force majeure events affecting the project's performance, in accordance with Article 1148 of the Ivorian Civil Code applied by analogy.
contract.art6.p4=<strong>6.4 Data protection:</strong> GrowzApp processes the Investor's personal data in accordance with Law No. 2013-450 of 19 June 2013 on the protection of personal data in Côte d'Ivoire and the recommendations of ARTCI.

contract.art7.title=WAEMU / BCEAO REGULATORY COMPLIANCE
contract.art7.p1=This contract is established in compliance with the regulatory framework of the West African Economic and Monetary Union (WAEMU), in particular:
contract.art7.p2=<strong>7.1 Payment settlement:</strong> All financial transactions related to this contract are carried out via payment channels approved by the BCEAO, in accordance with WAEMU Regulation No. 15/2002/CM/WAEMU on payment systems.
contract.art7.p3=<strong>7.2 AML-CFT:</strong> GrowzApp applies a strict Anti-Money Laundering and Counter-Terrorism Financing (AML-CFT) procedure in accordance with WAEMU Directive No. 02/2015/CM/WAEMU and Law No. 2016-992 of 22 November 2016 in Côte d'Ivoire. The Investor certifies that the invested funds originate from a lawful source.
contract.art7.p4=<strong>7.3 KYC (Know Your Customer):</strong> The Investor's identity has been verified in accordance with BCEAO KYC standards. Any inaccurate information provided by the Investor shall result in immediate termination of the contract and the freezing of funds pending judicial instruction.
contract.art7.ref=📖 Legal reference: WAEMU Directive No. 02/2015/CM/WAEMU — BCEAO Instruction No. 01-2006 — Ivorian Law No. 2016-992

contract.art8.title=DISPUTE RESOLUTION AND APPLICABLE LAW
contract.art8.p1=<strong>8.1 Applicable law:</strong> This contract is governed by the laws of the Republic of Côte d'Ivoire and by the OHADA Uniform Act on Commercial Company Law, as well as by any applicable WAEMU community text.
contract.art8.p2=<strong>8.2 Mediation:</strong> In the event of a dispute, the parties undertake to seek an amicable solution within 30 days of notification of the dispute by either party.
contract.art8.p3=<strong>8.3 CCJA arbitration:</strong> Failing an amicable resolution, any dispute shall be submitted to arbitration by the <strong>Common Court of Justice and Arbitration (CCJA)</strong> of OHADA, headquartered in Abidjan, in accordance with its arbitration rules. The language of the proceedings shall be French.
contract.art8.p4=<strong>8.4 Subsidiary jurisdiction:</strong> If arbitration is not applicable, the competent courts of Abidjan, Côte d'Ivoire, shall have exclusive jurisdiction.
contract.art8.ref=📖 Legal reference: OHADA Treaty Art. 21 — CCJA Arbitration Rules revised 2017 — Ivorian Code of Civil Procedure

