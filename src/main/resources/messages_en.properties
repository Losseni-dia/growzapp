contract.art10.title=DECLARATIONS AND UNDERTAKINGS OF THE INVESTOR
contract.art10.intro=By signing this contract, the Investor declares and warrants:
contract.art10.item1=✔ To have fully read and understood the terms of this contract;
contract.art10.item2=✔ To be of legal age (18 years or older) and to have full legal capacity;
contract.art10.item3=✔ That the invested funds originate from a lawful and transparent source;
contract.art10.item4=✔ To accept the risk of partial or total loss of the invested capital;
contract.art10.item5=✔ Not to be acting on behalf of an entity subject to international sanctions;
contract.art10.item6=✔ To undertake to inform GrowzApp of any change in circumstances (contact details, tax status).

