contract.art10.intro=Par la signature du présent contrat, l'Investisseur déclare et garantit :
contract.art10.item1=â Avoir lu et compris intégralement les conditions du présent contrat ;
contract.art10.item2=â Être majeur (18 ans révolus) et avoir pleine capacité juridique ;
contract.art10.item3=â Que les fonds investis proviennent d'une source licite et transparente ;
contract.art10.item4=â Accepter le risque de perte partielle ou totale du capital investi ;
contract.art10.item5=â Ne pas agir pour le compte d'une entité soumise à des sanctions internationales ;
contract.art10.item6=â S'engager à informer GrowzApp de tout changement de situation (coordonnées, statut fiscal).

