contract.section.general_conditions=📋 CONDITIONS GÉNÉRALES D'INVESTISSEMENT

contract.art1.title=OBJET ET NATURE DU CONTRAT
contract.art1.p1=Le présent contrat a pour objet la prise de participation de l'Investisseur au capital du Projet désigné ci-dessus, via la plateforme GrowzApp, opérateur de financement participatif en capital (<em>equity crowdfunding</em>).
contract.art1.p2=Cette participation confère à l'Investisseur le statut d'associé minoritaire, avec les droits et obligations afférents tels que définis par l'<strong>Acte Uniforme OHADA sur les Sociétés Commerciales et le Groupement d'Intérêt Économique (AUSCGIE)</strong>, notamment en ses articles 7, 45, 50 et 853 et suivants.
contract.art1.ref=📖 Référence légale : AUSCGIE, Art. 50 — Acte Uniforme révisé le 30 janvier 2014, OHADA

contract.art2.title=PROPRIÉTÉ DES PARTS ET TRANSFERT DE PROPRIÉTÉ
contract.art2.p1=L'Investisseur devient propriétaire des parts sociales susmentionnées dès la confirmation du paiement et la validation de l'investissement par GrowzApp. Cette propriété est opposable aux tiers dès son inscription dans le registre des associés tenu par GrowzApp conformément à l'AUSCGIE Art. 317.
contract.art2.p2=<strong>2.1 Droits attachés aux parts :</strong> Les parts confèrent à leur titulaire un droit proportionnel aux bénéfices distribués, un droit de vote consultatif lors des assemblées annuelles du projet, et un droit à l'information périodique sur l'avancement du projet.
contract.art2.p3=<strong>2.2 Indivisibilité :</strong> Les parts sont indivisibles à l'égard de GrowzApp et du porteur de projet. En cas de pluralité de propriétaires d'une même part, ceux-ci doivent se faire représenter par un mandataire unique (AUSCGIE Art. 321).
contract.art2.ref=📖 Référence légale : AUSCGIE, Art. 317, 321, 853 — OHADA 2014

contract.art3.title=SÉQUESTRE ET BLOCAGE DES FONDS
contract.art3.p1=Les fonds investis sont immédiatement sécurisés dans un compte séquestre dédié, distinct des fonds propres de GrowzApp, conformément aux exigences de la <strong>BCEAO</strong> en matière de protection des fonds des utilisateurs de monnaie électronique (Instruction BCEAO N°008-05-2015 et suivantes).
contract.art3.p2=Les fonds sont débloqués vers le porteur de projet selon un calendrier de jalons (milestones) validés par l'équipe d'expertise GrowzApp. En cas de non-atteinte des objectifs de levée de fonds dans le délai imparti, les fonds sont intégralement restitués à l'Investisseur sans frais.
contract.art3.p3=<strong>3.1 Garantie de restitution :</strong> GrowzApp s'engage à restituer les fonds de l'Investisseur dans un délai de 5 jours ouvrés si l'objectif de financement n'est pas atteint à l'échéance fixée.
contract.art3.ref=📖 Référence légale : Instruction BCEAO N°008-05-2015 sur la monnaie électronique — Règlement UEMOA N°15/2002/CM/UEMOA

contract.art4.title=DISTRIBUTION DES DIVIDENDES ET BÉNÉFICES
contract.art4.p1=Les dividendes sont calculés au prorata des parts détenues par l'Investisseur et distribués annuellement, après clôture et validation de l'exercice comptable du projet par un auditeur indépendant agréé.
contract.art4.p2=<strong>4.1 Modalités de distribution :</strong> Les dividendes sont versés sur le Wallet GrowzApp de l'Investisseur, puis retirables via les moyens de paiement disponibles sur la plateforme (Orange Money, MTN Mobile Money, Wave, virement bancaire).
contract.art4.p3=<strong>4.2 Fiscalité :</strong> Les dividendes perçus sont soumis aux impositions en vigueur en Côte d'Ivoire et dans l'espace UEMOA. L'Investisseur est responsable de la déclaration de ses revenus conformément à la législation fiscale de son pays de résidence. GrowzApp peut émettre une attestation fiscale sur demande.
contract.art4.p4=<strong>4.3 Prélèvement à la source :</strong> Conformément au Code Général des Impôts ivoirien, un précompte sur dividendes de 15% peut s'appliquer pour les investisseurs résidents, et de 18% pour les non-résidents, sauf convention fiscale bilatérale applicable.
contract.art4.ref=📖 Référence légale : AUSCGIE Art. 144 (distribution bénéfices) — Code Général des Impôts CI, Art. 95 — Directive UEMOA N°001/2008

contract.art5.title=LIQUIDITÉ, CESSION ET TRANSFERT DE PARTS
contract.art5.p1=La revente ou le transfert des parts est soumis aux conditions suivantes, conformément aux statuts du projet et à la réglementation OHADA en vigueur :
contract.art5.p2=<strong>5.1 Droit de préemption :</strong> En cas de cession, les autres associés (co-investisseurs) disposent d'un droit de préemption prioritaire d'acquisition des parts au prix proposé, pendant 30 jours calendaires à compter de la notification de la cession (AUSCGIE Art. 323).
contract.art5.p3=<strong>5.2 Tag-Along (Droit de suite) :</strong> Tout associé majoritaire cédant ses parts doit offrir aux associés minoritaires (dont l'Investisseur) la possibilité de céder leurs parts aux mêmes conditions (prix, acheteur, délais).
contract.art5.p4=<strong>5.3 Drag-Along (Droit d'entraînement) :</strong> Si les associés représentant plus de 75% du capital décident de céder l'intégralité du projet, les associés minoritaires peuvent être contraints de céder leurs parts aux mêmes conditions.
contract.art5.p5=<strong>5.4 Durée minimale de blocage :</strong> Les parts ne peuvent être cédées avant l'expiration d'une période minimale de 12 mois à compter de la date de validation de l'investissement.
contract.art5.ref=📖 Référence légale : AUSCGIE Art. 323, 329 — AUSCGIE Art. 56 (agrément cession)

contract.art6.title=OBLIGATIONS ET RESPONSABILITÉS DE GROWZAPP
contract.art6.p1=<strong>6.1</strong> GrowzApp s'engage à effectuer une due diligence rigoureuse sur chaque projet présenté sur la plateforme, incluant la vérification de l'identité du porteur, la viabilité économique du projet et la conformité réglementaire.
contract.art6.p2=<strong>6.2</strong> GrowzApp met à disposition de l'Investisseur des rapports d'avancement trimestriels du projet, ainsi qu'un accès à un espace personnel sécurisé permettant de suivre l'évolution de son portefeuille.
contract.art6.p3=<strong>6.3</strong> GrowzApp ne saurait être tenue responsable des aléas économiques, climatiques, réglementaires ou de force majeure affectant la performance du projet, conformément à l'article 1148 du Code Civil ivoirien applicable par analogie.
contract.art6.p4=<strong>6.4 Protection des données :</strong> GrowzApp traite les données personnelles de l'Investisseur conformément à la Loi N°2013-450 du 19 juin 2013 relative à la protection des données à caractère personnel en Côte d'Ivoire et aux recommandations de l'ARTCI.

contract.art7.title=CONFORMITÉ RÉGLEMENTAIRE UEMOA / BCEAO
contract.art7.p1=Le présent contrat est établi en conformité avec le cadre réglementaire de l'Union Économique et Monétaire Ouest-Africaine (UEMOA), notamment :
contract.art7.p2=<strong>7.1 Règlement des paiements :</strong> Toutes les transactions financières liées au présent contrat sont effectuées via des canaux de paiement agréés par la BCEAO, conformément au Règlement UEMOA N°15/2002/CM/UEMOA sur les systèmes de paiement.
contract.art7.p3=<strong>7.2 LCB-FT :</strong> GrowzApp applique une procédure stricte de Lutte Contre le Blanchiment de capitaux et le Financement du Terrorisme (LCB-FT) conformément à la Directive UEMOA N°02/2015/CM/UEMOA et à la Loi N°2016-992 du 22 novembre 2016 en Côte d'Ivoire. L'Investisseur certifie que les fonds investis proviennent d'une source licite.
contract.art7.p4=<strong>7.3 KYC (Know Your Customer) :</strong> La vérification d'identité de l'Investisseur a été effectuée conformément aux standards KYC de la BCEAO. Toute information erronée fournie par l'Investisseur entraîne la résiliation immédiate du contrat et le gel des fonds en attente d'instruction judiciaire.
contract.art7.ref=📖 Référence légale : Directive UEMOA N°02/2015/CM/UEMOA — Instruction BCEAO N°01-2006 — Loi CI N°2016-992

contract.art8.title=RÉSOLUTION DES LITIGES ET LOI APPLICABLE
contract.art8.p1=<strong>8.1 Loi applicable :</strong> Le présent contrat est régi par les lois de la République de Côte d'Ivoire et par l'Acte Uniforme OHADA relatif au Droit des Sociétés Commerciales, ainsi que par tout texte communautaire UEMOA applicable.
contract.art8.p2=<strong>8.2 Médiation :</strong> En cas de litige, les parties s'engagent à rechercher une solution amiable dans un délai de 30 jours à compter de la notification du différend par l'une des parties.
contract.art8.p3=<strong>8.3 Arbitrage CCJA :</strong> À défaut de résolution amiable, tout litige sera soumis à l'arbitrage de la <strong>Cour Commune de Justice et d'Arbitrage (CCJA)</strong> de l'OHADA, dont le siège est à Abidjan, conformément à son règlement d'arbitrage. La langue de la procédure sera le français.
contract.art8.p4=<strong>8.4 Juridiction subsidiaire :</strong> Si l'arbitrage n'est pas applicable, les juridictions compétentes d'Abidjan, Côte d'Ivoire, auront compétence exclusive.
contract.art8.ref=📖 Référence légale : Traité OHADA Art. 21 — Règlement d'arbitrage CCJA révisé 2017 — Code de Procédure Civile CI

